

{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastrar nova prova</h2>

<form method="POST">

    <div>
        <label>Nome da prova:</label>

        <input
            type="text"
            name="nome"
            placeholder="Ex: Prova de Matemática"
            required
        >
    </div>

    <br>

    <div>
        <label>Quantidade de questões:</label>

        <input
            type="number"
            name="quantidade_questoes"
            min="1"
            max="100"
            required
        >
    </div>

    <br>

    <div>
        <label>Valor total da prova:</label>

        <input
            type="number"
            name="valor_total"
            min="0.01"
            step="0.01"
            placeholder="Ex: 10.00"
            required
        >
    </div>

    <br>

    <button type="submit">
        Cadastrar prova
    </button>

</form>

{% endblock %}
